name: Enterprise DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: Build and Test the Spring Boot App
  # ==========================================
  build-and-test:
    name: Build & Test (Maven / Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backend with Maven
        working-directory: ./backend
        run: mvn clean package -DskipTests

  # ==========================================
  # JOB 2: Containerization & Trivy Security Scan
  # ==========================================
  security-scan:
    name: Docker Build, Trivy Scan & Push
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build the image locally in the action runner
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: Dockerfile
          load: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/devsecops-backend:latest

      # 2. Run Trivy Vulnerability Scanner on the built image
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_HUB_USERNAME }}/devsecops-backend:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # 3. Log in to Docker Hub (ONLY on the main branch)
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 4. Push the successfully scanned image to Docker Hub (ONLY on main branch)
      - name: Push Image to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/devsecops-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/devsecops-backend:sha-${{ github.sha }}