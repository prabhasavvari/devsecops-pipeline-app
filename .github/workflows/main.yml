name: Enterprise DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: Build and Test the Spring Boot App
  # ==========================================
  build-and-test:
    name: Build & Test (Maven / Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backend with Maven
        working-directory: ./backend
        run: mvn clean package -DskipTests

  # ==========================================
  # JOB 2: Containerization & Trivy Security Scan
  # ==========================================
  security-scan:
    name: Docker Build & Trivy Vulnerability Scan
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image in Cloud
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: backend-app:latest

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'backend-app:latest'
          format: 'table'
          exit-code: '0'   # Set to '1' in strict environments to fail the build if vulnerabilities exist
          severity: 'CRITICAL,HIGH'