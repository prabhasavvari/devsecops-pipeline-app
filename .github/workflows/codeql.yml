name: "CodeQL Security Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 1' # Runs every Monday at 1:30 AM UTC for continuous auditing

jobs:
  analyze:
    name: Analyze Java Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # Required by GitHub to upload CodeQL security alerts

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Set up Java 17 to match your project stack for compilation tracking
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 2. Initialize the CodeQL Engine
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended # Includes deeper vulnerability queries

      # 3. Build your Java code so CodeQL can trace the source logic
      - name: Build Backend for CodeQL Analysis
        run: |
          cd backend
          mvn clean compile -DskipTests

      # 4. Perform the CodeQL Analysis and upload results to GitHub Security tab
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"