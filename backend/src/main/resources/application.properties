server.port=8080

# Database Configuration (mapped directly from container environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Optional: Remove if you want Hibernate to auto-select the dialect (recommended for Hibernate 6+)
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Redis Cache Settings
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}

# Actuator Health Endpoints for Monitoring
management.endpoints.web.exposure.include=health,metrics